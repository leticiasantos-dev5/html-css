<!DOCTYPE html>
<html lang="pt-br"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    
    <form action="cadastro.php" method="post" autocomplete="on">
    
        <p>
            <label for="iano">Em que ano que você nasceu?</label>
            <input type="number" name="ano" id="iano" min="1900" max="2025" 
            oninput="calcIdade()"> 
        </p>

        <p>
            <label for="iidade">Sua idade é :</label>
            <output id="iidade">0</output>
        </p>
        
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

        </form> 

    <script>
        function calcIdade () {
            // Obtém o ano atual dinamicamente
            let atual = new Date().getFullYear()
            
            // Verifica se o campo de ano de nascimento tem um valor antes de calcular
            if (iano.value) { 
                iidade.innerHTML = Number(atual) - Number(iano.value)
            } else {
                iidade.innerHTML = 0
            }
        }
    </script>
    
</body>
</html>
