<!DOCTYPE html>
<html lang="pt-br
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on"></form>

    <p>
        <label for="iest">Estado :</label>
        <select name="estado" id="iest">
            <optgroup label="Região Norte">
        <option value="AC">Acre</option>
        <option value="AP">Amapá</option>
        <option value="AM">Amazonas</option>
        <option value="PA">Pará</option>
        <option value="RO">Rondônia</option>
        <option value="RR">Roraima</option>
        <option value="TO">Tocantins</option>
    </optgroup>

    <optgroup label="Região Nordeste">
        <option value="AL">Alagoas</option>
        <option value="BA">Bahia</option>
        <option value="CE">Ceará</option>
        <option value="MA">Maranhão</option>
        <option value="PB">Paraíba</option>
        <option value="PE">Pernambuco</option>
        <option value="PI">Piauí</option>
        <option value="RN">Rio Grande do Norte</option>
        <option value="SE">Sergipe</option>
    </optgroup>

    <optgroup label="Região Centro-Oeste">
        <option value="DF">Distrito Federal</option>
        <option value="GO">Goiás</option>
        <option value="MT">Mato Grosso</option>
        <option value="MS">Mato Grosso do Sul</option>
    </optgroup>

    <optgroup label="Região Sudeste">
        <option value="ES">Espírito Santo</option>
        <option value="MG">Minas Gerais</option>
        <option value="RJ">Rio de Janeiro</option>
        <option value="SP" selected>São Paulo</option>
    </optgroup>

    <optgroup label="Região Sul">
        <option value="PR">Paraná</option>
        <option value="RS">Rio Grande do Sul</option>
        <option value="SC">Santa Catarina</option>
    </optgroup>
        </select>
    </p>
    
    <p>
        <label for="iprofissao">Profissão:</label>
        <input type="text" name="prof" id="iprofissao" list="lstprof" placeholder="Selecione ou digite sua profissão">

        <datalist id="lstprof">
            <option">Administração</option>
            <option>Advocacia</option>
            <option>Agronomia</option>
            <option>Análise de Sistemas</option>
            <option>Arquitetura</option>
            <option>Assistência Social</option>
            <option>Atendimento ao Cliente</option>
            <option>Biologia</option>
            <option>Contabilidade</option>
            <option>Culinária / Gastronomia</option>
            <option>Design Gráfico</option>
            <option>Educação Física</option>
            <option>Enfermagem</option>
            <option>Engenharia Civil</option>
            <option>Engenharia de Produção</option>
            <option>Farmácia</option>
            <option>Finanças</option>
            <option>Fisioterapia</option>
            <option>Jornalismo</option>
            <option>Marketing</option>
            <option>Medicina</option>
            <option>Nutrição</option>
            <option">Odontologia</option>
            <option>Pedagogia</option>
            <option>Psicologia</option>
            <option>Publicidade e Propaganda</option>
            <option>Recursos Humanos</option>
            <option >Secretariado</option>
            <option>Segurança do Trabalho</option>
            <option >Serviços Gerais</option>
            <option >Tecnologia da Informação</option>
            <option >Vendas / Comercial</option>
        </datalist>
    </p>

    <p>
        <label for="imsg">Mensagem :</label><br>
        <textarea name="msg" id="imsg" cols="30" rows="10"></textarea>
    </p>

    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
    
</body>
</html>
