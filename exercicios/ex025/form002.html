<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de formulário</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="isu">Usuário:</label>

            <input type="text" name="usu" id="isu" required minlength="5" maxlength="30" size="10" placeholder="Digite seu nome" autocomplete="username" > 
            <!--campo obrigatorio required, e min e max é a quantidade de letras que deve ter, size o tamanho da caixa, placeholder a dica da caixa-->
        </p>
        <p>
            <label for="isen">Senha:</label>
            <input type="password" name="sen" id="isen"required minlength="8" size="8" placeholder="minímo 8 letras" autocomplete="current-password"> <!--current-password é para senha que já existe já new password é nova-->

        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    
</body>
</html>
