<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse; /* para as linhas ficarem juntas*/
            width: 300px;
            text-align: center;
    
        }

        td {
            border: 1px solid black;
            padding: 10px; /* para ficarem maiores*/
        }
    </style>
</head>
<body>
    <h1>Mesclagem de Células</h1>
    <table>
        <tr>
            <td>A</td>
            <td colspan="2">B</td> <!--Ocupe duas linhas horizontal-->
            

        </tr>
            <td rowspan="3">D</td> <!--Ocupe tres linhas vertical-->
            
            <td>E</td>
            <td rowspan="2" >F</td> 

        <tr>
            
            <td>H</td>
            
            
        </tr>

        <tr>
           
            <td colspan="2">K</td>
           
            
        </tr>

    </table>
    
</body>
</html>
