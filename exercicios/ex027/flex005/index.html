<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox centralizado</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body{

            background-color: #0c0c5a;
            color: white;
            
        }

        main{ /*é o elemto pai ele aconselhou que melhor nunca usar body como o pai*/
            background-color: #6d6df5;
            height: 100vh;
            width: 100vw;
            text-align: center;
            
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
        }

        section{
            background-color: #353583;
            height: 200px;
            width: 200px;

            
        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>Tela de Login</h1>
            
        </section>
    </main>
    
</body>
</html>
